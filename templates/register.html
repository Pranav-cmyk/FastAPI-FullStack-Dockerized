{% include 'layout.html' %}

<div class = 'container'>
    <div class = 'card'>
        <div class = 'card-header'>Register</div>
        <div class = 'card-body'>
            <form id = "registerForm">

                <div class = 'form-row'>
                    <div class = 'form-group col-md-6'>
                        <label>Email</label>
                        <input type = 'text' class = 'form-control' name = 'email' autocomplete="email" required>
                    </div>
                    <div class = 'form-group col-md-6'>
                        <label>Username</label>
                        <input type = 'text' class = 'form-control' name = 'username' autocomplete="username" required>
                    </div>
                </div>

                <div class = 'form-row'>
                    <div class = 'form-group col-md-6'>
                        <label>First Name</label>
                        <input type = 'text' class = 'form-control' name = 'firstname' autocomplete="firstname" required>
                    </div>
                    <div class = 'form-group col-md-6'>
                        <label>Last Name</label>
                        <input type = 'text' class = 'form-control' name = 'lastname' autocomplete="lastname" required>
                    </div>
                </div>

                <div class = 'form-row'>
                    <div class = 'form-group col-md-6'>
                        <label>Role</label>
                        <input type = 'text' class = 'form-control' name = 'role' autocomplete="role" required>
                    </div>
                    <div class = 'form-group col-md-6'>
                        <label>Phone Number</label>
                        <input type = 'text' class = 'form-control' name = 'phonenumber' autocomplete="phone_number" required>
                    </div>
                </div>

                <div class = 'form-group'>
                    <label> Password </label>
                    <input type = 'password' class = 'form-control' name = 'password' required>
                </div>

                <div class = 'form-group'>
                    <label> Confirm Password </label>
                    <input type = 'password' class = 'form-control' name = 'confirm_password' required>
                </div>

                <button type = 'submit' class = 'btn btn-primary'>Sign in</button>
                                
            </form>
        </div>
        <div class = 'card-footer text-muted'>
            Already have an account? <a href = "/auth/login-page" style="color: teal;" >Login</a>
        </div>
    </div>
</div>
